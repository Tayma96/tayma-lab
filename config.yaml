# Ayarlar. Telefondan düzenle: GitHub'da bu dosyayı aç > kalem simgesi > Commit changes.

game_name: "Grand Theft Auto VI"

# --- Kaynak 1: Twitch'teki popüler klipler (izlenme HIZINA göre sıralanır) ---
discovery:
  language: en
  lookback_hours: 24
  min_views: 300
  min_duration: 8
  max_clips_per_run: 15
  top_streamers_boost: 30   # şu an canlıda en çok izlenen ilk N yayıncının kliplerine bonus
  languages: [en, tr]       # en: global (YouTube + TikTok) | tr: Türk yayıncılar (sadece TikTok)

# --- Kaynak 2: Canlı avcı. Sohbet patladığı anda Twitch klibi oluşturur (en hızlı içerik) ---
# Gerekli: `gta6clips auth twitch` (klip oluşturma izni, senin Twitch hesabınla)
live:
  enabled: true
  top_channels: 25          # en çok izlenen kaç GTA 6 yayınını dinlesin
  min_viewers: 1500
  refresh_minutes: 5
  spike_ratio: 3.0          # sohbet normalin kaç katına çıkınca "patlama" sayılsın
  min_weight: 15            # 6 saniyede en az bu kadar (ağırlıklı) mesaj
  cooldown_seconds: 120     # aynı kanalda iki klip arası
  max_clips_per_hour: 20
  pre_roll_seconds: 10      # klip andan kaç saniye önce başlasın
  chat_lag_seconds: 7       # sohbet anın kaç saniye gerisinden patlar (yayın gecikmesi + yazma)

# --- Kesim: cümle ya da bağırış ortasında kesilmez, konuşma boşluklarına oturtulur ---
cut:
  min_length: 12
  max_length: 45
  min_after_moment: 8       # andan sonra en az bu kadar tepki

# --- Yapay zeka: TAMAMEN ÜCRETSİZ ---
# github: GitHub Models (GitHub Actions'ta anahtarsız, ücretsiz; günlük sınır dolunca sezgisele düşer)
# none:   yapay zeka yok, ücretsiz sinyallerle puanlama (izlenme hızı, sohbet, ses, hareket, konuşma)
# claude: ÜCRETLİ, kullanma
ai:
  provider: none            # GitHub Models bu hesapta yanıt vermiyor (her isteğe "OK"); çalışırsa: github
  github_model: openai/gpt-4o-mini
  max_images: 4

# --- Kalite kapısı: her klip 1-10 puanlanır, eşiğin altı yüklenmez ---
quality:
  min_score: 6              # altı hiç kurgulanmaz/yüklenmez. Hacim istersen 5, seçicilik istersen 7
  frames: 6                 # yapay zekaya gösterilecek kare sayısı
  effort: medium

blocklist: []

# Yüz kamerası otomatik bulunur (data/facecams.json). Yanlışsa buradan düzelt (0-1 oranları).
facecams:
  # ornekyayinci: {x: 0.0, y: 0.0, w: 0.25, h: 0.3}

render:
  layout: fit               # fit: Twitch'teki "Dolu" gibi, dikey çerçevede yayının tamamı (YouTube Shorts)
                            # stack: yüz kamerası üstte + oyun altta | blur: bulanık arka plan
  zoom: 1.15
  auto_facecam: true
  captions: true
  whisper_model: small
  hook: true
  credit: true
  progress_bar: true        # altta dolan çubuk (izlenme süresini artırır)
  brand: ""                 # kanal adın, örn "@gta6moments" (sağ üstte küçük)

metadata:
  model: claude-opus-5-5
  effort: low

upload:
  youtube:
    enabled: false
    max_per_day: 6
    privacy: public
    category_id: "20"
    languages: [en]         # YouTube: sadece global (İngilizce yayınlar, İngilizce altyazı)
  tiktok:
    enabled: false
    max_per_day: 10
    method: browser         # browser: tiktok-uploader (herkese açık) | api: resmi API
    headless: true
    visibility: everyone
    languages: [en, tr]     # TikTok: global + Türk yayıncılar
    subtitles: tr           # TikTok sürümü Türkçe altyazılı ve Türkçe başlıklı
    layout: landscape       # yatay 16:9: TikTok'ta "tam ekran / yan çevir" düğmesi çıkar, yayın gibi
  min_gap_minutes: 45
  peak_hours_utc: []        # boş = her saat. Örn ABD akşamı: [22, 23, 0, 1, 2, 3, 4]
  max_age_hours: 36         # bundan eski klipler artık yüklenmez (bayat içerik)

# --- Lansman modu: GTA 6'nın açıldığı anlar (yerel gece yarısı) ---
# Bu anların 20 dk öncesinden 90 dk sonrasına kadar: en büyük yayınlar + aşağıdaki tanınmış yayıncılar
# (Just Chatting'de açsalar bile) dinlenir, klipler kalite kapısına takılmadan, sıra beklemeden işlenir,
# hazır video Telegram'dan telefonuna gelir. Günlük yükleme hakkının bir kısmı bu anlara ayrılır.
launch:
  enabled: true
  moments_utc:
    - "2026-11-18T11:00:00Z"   # Yeni Zelanda gece yarısı (14:00 TSİ) - kategori 2 milyon izleyiciye çıktı
    - "2026-11-18T21:00:00Z"   # Türkiye gece yarısı (00:00 TSİ) - Türk yayıncılar
    - "2026-11-19T00:00:00Z"   # İngiltere gece yarısı (03:00 TSİ)
    - "2026-11-19T05:00:00Z"   # ABD doğu gece yarısı (08:00 TSİ) - en büyük yayıncılar
    - "2026-11-19T08:00:00Z"   # ABD batı gece yarısı (11:00 TSİ)
  watch_channels:              # Twitch kullanıcı adları; istediğini ekle/çıkar
    - kaicenat
    - xqc
    - summit1g
    - caseoh_
    - jynxzi
    - zackrawrr
    - hasanabi
    - moistcr1tikal
    - lirik
    - shroud
    - sodapoppin
    - tarik
  watch_channels_tr:           # Türk yayıncılar (Twitch kullanıcı adları; Kick'tekiler yakalanamaz)
    - elraenn
    - wtcn
    - kendinemuzisyen
    - pqueen
    - unlostv
    - mithrain
    - levo
    - eray
    - rraenee
    - hype
  after_minutes: 120          # anın ardından kaç dakika lansman modunda kalınsın
  reserve: {youtube: 3, tiktok: 5}   # lansmandan önceki 24 saatte sıradan kliplerin bırakacağı hak

# --- Telegram: lansman klipleri ve 8+ puanlı videolar telefonuna gelir (TELEGRAM_BOT_TOKEN secret'ı) ---
notify:
  telegram: false
  min_quality: 8

schedule:
  discover_minutes: 15
  stats_hours: 3            # YouTube izlenmelerini çekip yayıncı ağırlıklarını güncelle

paths:
  data_dir: data
