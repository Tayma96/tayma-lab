# Kopyala: cp config.example.yaml config.yaml

game_name: "Grand Theft Auto VI"

discovery:
  language: en              # sadece İngilizce yayınlar
  lookback_hours: 24        # son kaç saatin klipleri
  min_views: 500            # bu izlenmenin altındaki klipleri atla
  min_duration: 8           # saniye
  max_clips_per_run: 15
  # En çok izlenen yayıncılar önce gelsin: şu an GTA 6 yayınında olan ilk N yayıncının kliplerine bonus
  top_streamers_boost: 30

# Şikayet eden ya da istemediğin yayıncıları buraya ekle (küçük harf, Twitch kullanıcı adı)
blocklist: []

# Yüz kamerası konumu otomatik bulunur (render.auto_facecam) ve data/facecams.json'a yazılır.
# Yanlış bulursa buradan elle düzelt (oranlar 0-1, kaynak videoya göre); elle girilen her zaman önceliklidir.
# Yüz kamerası yoksa oyun görüntüsü bulanık arka planın ortasına yerleşir.
facecams:
  # ornekyayinci: {x: 0.0, y: 0.0, w: 0.25, h: 0.3}

render:
  zoom: 1.15                # oyun görüntüsüne hafif yakınlaştırma
  auto_facecam: true        # OpenCV ile yüz kamerasını bul -> üstte yüz, altta oyun düzeni
  captions: true            # Whisper ile kelime kelime altyazı (faster-whisper gerekir)
  whisper_model: small
  hook: true                # üstte büyük açılış metni
  credit: true              # alt kısımda "twitch.tv/<yayıncı>" kredisi

metadata:
  model: claude-opus-5-5
  effort: low

upload:
  youtube:
    enabled: true
    max_per_day: 6          # varsayılan API kotası ~6 yükleme/gün
    privacy: public
    category_id: "20"       # Gaming
  tiktok:
    enabled: true
    max_per_day: 10
    # browser: tiktok-uploader ile tarayıcıdan, denetim beklemeden herkese açık (çerez gerekir)
    # api: resmi Content Posting API (denetim onaylanana kadar sadece gizli paylaşım)
    method: browser
    headless: true          # TikTok engellerse false yap (ekranlı sunucu / xvfb gerekir)
    visibility: everyone
  min_gap_minutes: 45       # aynı platformda iki yükleme arası

paths:
  data_dir: data
