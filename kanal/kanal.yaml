# Kanalın tek ayar dosyası. Skiller (özellikle /yt-fabrika) buradan okur.
# Gerekçeler: docs/STRATEJI.md

kanal:
  ad: null                 # henüz seçilmedi
  nis: "Business stories - how companies rose, fell and made their money"
  yedek_nis: "Technology and science, explained"
  dil: en
  hedef_ulkeler: [US, GB, CA, AU]
  kitle: "Adults 25-54 curious about business, brands and the people behind them"
  made_for_kids: false

format:
  uzun_video_dk: [8, 14]
  haftalik_uzun_video: 2
  uzun_video_basina_shorts: [2, 3]     # yalnızca uzun videodan kesilir
  gorsel: [gercek_goruntu, arsiv, harita, grafik, belge]  # ucretsiz-kaynak + remotion
  kurgu: ffmpeg-skill
  yuz: false

ses:
  saglayici: chatterbox    # ücretsiz, MIT. Kanal kazanınca: elevenlabs eleven_v4 (ücretli plan)
  model: original          # GPU yoksa: nano (CPU'da çalışır)
  referans: null           # voice/ref.wav - yalnızca modelin kendi sesi ya da kullanıcının kendi sesi
  exaggeration: 0.55
  cfg_weight: 0.4
  yapay_zeka_etiketi: true # YouTube Studio'daki AI sorusu her yüklemede dürüstçe cevaplanır

yayin:
  insan_onayi_zorunlu: true
  varsayilan_gorunurluk: private      # onaydan sonra planlı yayına alınır
  aciklama_alt_notu: >-
    Sources for every fact are linked below. This video is for education and
    entertainment only, not financial advice. Narration uses an AI voice.
    Trademarks belong to their owners; this channel is not affiliated with them.

butce:
  aylik_usd: 0
  ucretsiz_api_anahtarlari: [PEXELS_API_KEY, PIXABAY_API_KEY]  # .env içinde

hedefler:
  ypp: {abone: 1000, izlenme_saati_12ay: 4000}
  ilk_kontrol: "8. videodan sonra: ortalama izlenme süresi, CTR, en çok izlenen 2 konu"
