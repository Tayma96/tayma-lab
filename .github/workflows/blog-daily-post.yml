name: "Blog — Günlük Yazı (LLM)"

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 06:17 UTC = 09:17 TSİ (günde 1 yazı)
  workflow_dispatch:
    inputs:
      topic:
        description: "İsteğe bağlı: topics.yaml içindeki belirli bir slug"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-daily-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.gen.outputs.generated }}
      slug: ${{ steps.gen.outputs.slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r blog/scripts/requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "satici-rehberi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Yazı üret, kalite kontrolü yap, commit + push
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW }}
          MIN_WORDS: ${{ vars.MIN_WORDS || '800' }}
        run: |
          ARGS="--commit-push"
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ github.event.inputs.topic }}"; fi
          python blog/scripts/generate_post.py $ARGS

  deploy:
    needs: generate
    if: needs.generate.outputs.generated == 'true'
    # GITHUB_TOKEN ile yapılan push başka iş akışlarını tetiklemez; bu yüzden deploy'u doğrudan çağırıyoruz.
    uses: ./.github/workflows/blog-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
