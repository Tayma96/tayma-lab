# Bir kez çalıştır: canlı avcının senin Twitch hesabınla klip oluşturabilmesi için giriş.
# Çalıştırınca logda bir kod çıkar; telefondan twitch.tv/activate adresine girip o kodu yaz.
name: Twitch girişi

on:
  workflow_dispatch:

concurrency:
  group: gta6clips
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: bash scripts/state.sh unpack
      - name: "Kodu logda gör, twitch.tv/activate adresine gir"
        run: gta6clips auth twitch --device
      - run: bash scripts/state.sh pack
      - uses: actions/cache/save@v4
        with:
          path: state.enc
          key: state-${{ github.run_id }}
