[project]
name = "gta6clips"
version = "0.1.0"
description = "Twitch'teki en popüler GTA 6 kliplerini bulur, dikey Shorts/TikTok formatına kurgular ve yükler."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2",
    "requests>=2.31",
    "pyyaml>=6",
    "python-dotenv>=1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "yt-dlp>=2025.1.1",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.1"]
tiktok-browser = ["tiktok-uploader>=1.2,<2"]
dev = ["pytest>=8"]

[project.scripts]
gta6clips = "gta6clips.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
