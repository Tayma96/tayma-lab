[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakedis"
version = "0.1.0"
description = "Trendyol / Hepsiburada hakediş geri kazanım tarayıcısı (iskelet, offline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hakedis = "hakedis.cli:main"

[tool.setuptools.packages.find]
include = ["hakedis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
